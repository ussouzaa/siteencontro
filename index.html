<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nosso Primeiro Encontro</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #000000, #1c1c1c, #2c2c2c);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

.container {
    max-width: 700px;
    padding: 20px;
}

h1 {
    font-size: 30px;
    margin-bottom: 20px;
}

p {
    font-size: 18px;
    line-height: 1.6;
}

img {
    width: 280px;
    border-radius: 15px;
    margin: 20px 0;
    box-shadow: 0 0 25px rgba(255,255,255,0.2);
}

button {
    margin-top: 20px;
    padding: 15px 35px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    background: #b00000;
    color: white;
    transition: 0.3s;
}

button:hover {
    background: #800000;
}
</style>
</head>

<body>

<audio id="musica" loop>
    <source src="afterhours.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>Vamos escolher nosso primeiro encontro?</h1>

    <img src="lugares/corinthians.jpg">

    <p>
        Fiquei dias pensando nos melhores momentos,
        porque no final são as memórias que ficam.
    </p>

    <button onclick="iniciar()">Escolher nosso primeiro encontro</button>
</div>

<script>
let musica = document.getElementById("musica");
musica.volume = 0.2;

function iniciar() {
    musica.play().then(() => {
        setTimeout(() => {
            window.location.href = "galeria.html";
        }, 800);
    });
}
</script>

</body>
</html>
